# 第四章：带湖（1181-1192）
# 稼轩的田园与悲愤：罢官归耕、村居词、鹅湖之会、醉里挑灯
# 主题：最闲适的词背后是杀敌无门——词与处境的反差是本章核心张力
id: daihu
figure: xin-qiji
title: 带湖
subtitle: 稼轩的田园与悲愤
era: 1181-1192
scenes:
  # ---------- 带湖新居 ----------
  - id: retire-daihu
    type: narrative
    tone: light
    title: 稼轩
    text: |
      淳熙八年冬，弹章落下来了。台臣王蔺劾你：用钱如泥沙，杀人如草芥。罢去一切职务。

      从江阴签判算起，你宦游南宋将近二十年，做过州官、当过帅臣，练过兵、平过乱、上过书——恢复的事，你准备了一辈子，朝廷始终没有用你向北。如今四十二岁，你等来的第一件大事，是削职为民。

      好在你早有安排。几年前你就预感仕途险恶，在上饶城外带湖畔买地筑室，此时新居恰好落成。你带着家眷住进去，给居所取名稼轩，自号稼轩居士。稼是种植谷物，轩是长廊小室——人生在勤，当以力田为先，你把这两个字挂在了门楣上。

      名字是田家的名字，剑还挂在书房的壁上。此后十年，你在这片湖山里种地、读书、会客、填词——一柄闲着的剑，和它闲着的主人。
    image: images/retire-daihu.jpg
    place: 上饶
    year: 1181
    source: 《宋史·辛弃疾传》（王蔺劾罢事）；邓广铭《辛稼轩年谱》淳熙八年、九年带湖新居条
    notes:
      - "「用钱如泥沙，杀人如草芥」——台臣弹章语，见《宋史》本传；本传系此语于福建任被劾时，与本处所系淳熙八年（1181）冬之罢或非一事，待核"
      - "带湖新居落成于淳熙八年（1181）冬，先购地于任上——洪迈《稼轩记》即系于此年，记中已写园居规模；「稼轩」命名见《宋史》本传所载「故以『稼』名轩」，命名缘起参《稼轩记》"
      - "罢官后十余年闲居（1182-1192）：从邓谱"
    proofed: true

  # ---------- 村居 ----------
  - id: village-home
    type: poem
    tone: light
    poem_title: 清平乐·村居
    lead_in: 带湖的日子安静。吴音柔软，溪水绕村，你看着一户人家的三个儿子各忙各的，最小的那个躺卧溪头剥莲蓬——你把这一家五口写进小令，闲适得不像出自一个带兵的人——
    text: |
      茅檐低小，溪上青青草。

      醉里吴音相媚好，白发谁家翁媪？

      大儿锄豆溪东，中儿正织鸡笼。

      最喜小儿亡赖，溪头卧剥莲蓬。
    keyline: 最喜小儿亡赖，溪头卧剥莲蓬
    place: 上饶
    year: 1185
    source: 邓广铭《稼轩词编年笺注》带湖期词；邓广铭《辛稼轩年谱》
    notes:
      - "作年无确考，系带湖闲居期，谱中多系于此数年之间"
      - "「亡赖」通「无赖」，此处作可爱解，非贬义"
      - "「吴音」：上饶地近吴语区；辛弃疾北人，听吴音为客居耳中之声"
    proofed: true

  # ---------- 黄沙道中 ----------
  - id: huangsha-road
    type: poem
    tone: light
    poem_title: 西江月·夜行黄沙道中
    lead_in: 上饶西边有黄沙岭，道中有你常走的夜路。某年夏夜，你从岭上归来——明月、惊鹊、稻花香、蛙声，还有转过溪桥忽然出现的旧时茅店。国泰民安该有的样子，你在一夜之间全部遇上了——
    text: |
      明月别枝惊鹊，清风半夜鸣蝉。

      稻花香里说丰年，听取蛙声一片。

      七八个星天外，两三点雨山前。

      旧时茅店社林边，路转溪桥忽见。
    keyline: 稻花香里说丰年，听取蛙声一片
    place: 上饶
    year: 1188
    source: 邓广铭《稼轩词编年笺注》带湖期词；黄沙岭在上饶西，从邓谱及地志
    notes:
      - "作年无确考，系带湖闲居期，谱中多系于此数年之间"
      - "「路转溪桥」一作「路转溪头」，通行本作「溪桥」"
      - "黄沙岭：在上饶县西四十里黄沙坂，见地方志，待校"
    proofed: true

  # ---------- 博山道中 ----------
  - id: boy-sorrow
    type: poem
    tone: light
    poem_title: 丑奴儿·书博山道中壁
    lead_in: 广丰有博山，山中有庵，你常独游夜宿。壁上题词，成了你排遣的一种方式。这一首，你把自己的一生劈成两半——少年的愁，是不知道愁；如今的愁，是说不出口——
    text: |
      少年不识愁滋味，爱上层楼。

      爱上层楼，为赋新词强说愁。

      而今识尽愁滋味，欲说还休。

      欲说还休，却道天凉好个秋。
    keyline: 欲说还休，却道天凉好个秋
    place: 博山
    year: 1188
    source: 邓广铭《稼轩词编年笺注》带湖期词；博山在信州永丰（今广丰），从邓谱及地志
    notes:
      - "作年无确考，系带湖闲居期，谱中多系于此数年之间"
      - "博山：在今江西广丰，山有博山庵，辛弃疾常宿庵中题壁——从地志，待校"
      - "「强说愁」之「强」读qiǎng，勉强义"
    proofed: true

  # ---------- 鹅湖之会 ----------
  - id: ehu-meeting
    type: event
    tone: light
    title: 鹅湖之会
    text: |
      淳熙十五年冬，陈亮来了。

      陈亮，字同甫，婺州人，永康学派的魁首，与你神交已久——同是主战的孤臣孽子，同是一肚子不合时宜。他从东阳冒着风雪来访，你到紫溪迎接，两人同游鹅湖寺，共饮瓢泉。

      十日之间，长歌相答，极论世事。论的是什么？金人的虚实，恢复的方略，还有天底下最痛的那个问题：事有可为，人为何不用。说到激越处，两个失路的人拍案痛饮。

      陈亮别后，你怅然若失，第二天驾车想追他回来，追到鹭鸶林，雪深泥滑，不得前，只得怅然而返。此后两人千里唱和，一阕《贺新郎》递过去，一阕和词递回来，往复再三。

      你不是没有朋友，你是终于遇到一个能说真话的人。这段唱和里的词句，此后千年都是硬的。
    image: images/ehu-meeting.jpg
    place: 铅山
    year: 1188
    source: 邓广铭《辛稼轩年谱》淳熙十五年冬陈亮来访条；《稼轩词编年笺注》贺新郎诸阕题序（「陈同父自东阳来过余……留十日」）；辛弃疾《祭陈同父文》
    notes:
      - "「长歌相答，极论世事」——辛弃疾《祭陈同父文》原文"
      - "追至鹭鸶林雪深而返：出《贺新郎》词序（「至鹭鸶林，则雪深泥滑，不得前矣」）"
      - "十日之间：词序有「留十日」语，从邓谱"
      - "永康学派魁首：陈亮为事功之学代表人物，后状元及第（绍熙四年）"
    proofed: true

  # ---------- 醉里挑灯 ----------
  - id: drunk-sword
    type: poem
    tone: light
    poem_title: 破阵子·为陈同甫赋壮词以寄之
    lead_in: 与陈亮相识之后，你那些压了几十年的梦有了出口。某夜酒酣，你挑亮灯芯，把壁上的剑取下来看——剑还是那柄剑，梦还是那个梦。你为陈同甫写下这首壮词，九句向前，最后一句拽回——
    text: |
      醉里挑灯看剑，梦回吹角连营。

      八百里分麾下炙，五十弦翻塞外声。

      沙场秋点兵。

      马作的卢飞快，弓如霹雳弦惊。

      了却君王天下事，赢得生前身后名。

      可怜白发生！
    keyline: 了却君王天下事，赢得生前身后名。可怜白发生
    place: 上饶
    year: 1188
    source: 邓广铭《稼轩词编年笺注》淳熙十五年前后条（与陈亮唱和诸作）；邓广铭《辛稼轩年谱》
    notes:
      - "系年从邓笺，编于淳熙十五年（1188）陈亮唱和前后；一说非一时一地之作，待校"
      - "八百里：晋王恺牛名「八百里驳」，后以「八百里」指牛——「八百里分麾下炙」即烤牛肉分部下，典出《世说新语》"
      - "五十弦：本指瑟，李商隐「锦瑟无端五十弦」——此处泛指军乐"
      - "的卢：刘备骑的卢马跃檀溪典，喻良马"
    proofed: true

  # ---------- 心如铁 ----------
  - id: iron-heart
    type: poem
    tone: light
    poem_title: 贺新郎·同父见和再用韵答之（节选）
    lead_in: 唱和往复，你用同一词韵再答陈亮。上片叹老大那堪说，下片把话说到了底——神州几番离合，骏骨无人顾，而你与同父：男儿到死——
    text: |
      正目断关河路绝。

      我最怜君中宵舞，道男儿、到死心如铁。

      看试手，补天裂。
    excerpt: 词为长调，此处节录下片末三韵；上片「老大那堪说。似而今、元龙臭味，孟公瓜葛……」与下片前段「事无两样人心别。问渠侬：神州毕竟，几番离合？汗血盐车无人顾，千里空收骏骨」从略。
    keyline: 看试手，补天裂
    place: 上饶
    year: 1189
    source: 邓广铭《稼轩词编年笺注》淳熙十六年条（陈亮和词再答）；邓广铭《辛稼轩年谱》
    notes:
      - "「我最怜君中宵舞」：用祖逖闻鸡起舞典，赞陈亮——中宵起舞，志在恢复"
      - "补天裂：女娲炼石补天典，喻恢复中原"
      - "汗血盐车、千里骏骨：骥服盐车典（《战国策》）与燕昭王千金市骨典——俊才困于下位、朝廷徒然求马之名"
      - "系年淳熙十六年（1189）从邓笺"
    proofed: true
