# 建康章：无所之
# 情绪曲线：雪中从容 - 缒城之夜 - 乌江烈句 - 池阳诀别 - 八月十八 - 无所之
# 崩塌之年：先是他的城，再是他的人
id: jiankang
figure: li-qingzhao
title: 建康
subtitle: 无所之
era: 1128-1129
scenes:
  # ---------- 雪中循城 ----------
  - id: xuncheng-xue
    type: narrative
    tone: light
    title: 雪中循城
    text: |
      江宁的一年多，你们住在围城的秩序里。他在任知府，你在乱世中过着难得安稳的日子——书箱开着，日子照旧。

      每逢大雪，你顶笠披蓑，沿着城墙走很远的路，看雪，寻诗。得了句子，回来邀他同和——他常常和不出，苦着脸推敲，你在一旁等。

      雪天的城头，能望见长江。江那边，是回不去的山东。

      这是你们最后的安稳时光。
    image: images/xuncheng-xue.jpg
    place: 江宁
    year: 1128
    source: 周煇《清波杂志》「顷见易安族人言，明诚在建康日，易安每值天大雪，即顶笠披蓑，循城远览以寻诗，得句必邀其夫赓和，明诚每苦之也」
    notes:
      - "此段出自周煇记易安族人转述——笔记材料，画面具体，细节从简取意"
      - "江宁府于建炎三年五月升建康府；本场景在升府前，章内一律用旧称"
    proofed: true

  # ---------- 缒城之夜 ----------
  - id: zhuicheng-night
    type: narrative
    tone: dark
    title: 缒城之夜
    text: |
      建炎三年二月，御营统制官王亦在城中密谋作乱。消息走漏，军官李谟设伏，天亮前把乱事平定了。

      清点之时，人们发现了一件更难堪的事：知府赵明诚，和通判、观察推官两人一起，在夜里用绳索缒下城墙，逃走了。

      乱平了，官丢了。三月，朝廷处分下来：坐弃城之罪，罢官。

      同舟西上的时候，你们之间是什么气氛，没有记载。船过当涂，前面就是乌江。
    image: images/zhuicheng-night.jpg
    place: 江宁
    year: 1129
    source: 李心传《建炎以来系年要录》卷二十建炎三年二月条；徐培均《李清照集笺注》附年谱
    notes:
      - "缒城宵遁、三月坐弃城罢官，均见《要录》——本页深色底：她看见丈夫的另一面"
      - "同舟西上路线：具舟上芜湖、入姑孰，将卜居赣水上，从年谱"
    proofed: true

  # ---------- 乌江 ----------
  - id: wujiang-poem
    type: poem
    tone: light
    poem_title: 夏日绝句
    lead_in: 项羽兵败垓下，突围到乌江。亭长撑船等他，说江东虽小，亦足王也。他笑答：天之亡我，我何渡为——不肯过江，自刎而死。一千三百年后，你们的船经过这里。江边有项羽的祠。你站在祠前想那个人：他有一万个理由渡江，他偏不——
    text: |
      生当作人杰，死亦为鬼雄。

      至今思项羽，不肯过江东。
    keyline: 至今思项羽，不肯过江东
    place: 乌江
    year: 1129
    source: 王仲闻《李清照集校注》（卷次待核）；通行编年系于建炎三年过乌江时；项羽事见《史记·项羽本纪》
    notes:
      - "诗无自系年，通行编年系于此年过乌江；「借项羽讽赵明诚」为后人解读，诗本身是咏史，正文不采"
      - "乌江：今安徽和县乌江镇，江边有项羽祠（霸王祠）"
    proofed: true

  # ---------- 池阳之别 ----------
  - id: chiyang-parting
    type: narrative
    tone: light
    title: 池阳之别
    text: |
      五月，你们到了池阳。朝廷又起用他：知湖州。六月十三日，他安顿好家眷，独自登舟赴建康面圣。

      你在船上送他。他坐在岸上，穿着葛衣，露着额头，精神如虎，目光烂烂射人——这个形象，你在多年后写下来，一字未改。

      你心里发沉，隔着水喊：如果传来城中告急的消息，怎么办？他远远地伸手指着，大声答：从众。万不得已，先丢辎重，再丢衣被，再丢书册卷轴，再丢古器——只有宗器，自己抱着，与你共存亡，别忘了。

      船开了。岸上那个精神如虎的人，越来越远。
    image: images/chiyang-parting.jpg
    place: 池阳
    year: 1129
    source: 李清照《金石录后序》「六月十三日，始负担舍舟，坐岸上，葛衣岸巾，精神如虎，目光烂烂射人……（嘱曰）从众。必不得已，先弃辎重，次衣被，次书册卷轴，次古器；独所谓宗器者，可自负抱，与身俱存亡，勿忘之」
    notes:
      - "「宗器」：宗庙礼器，收藏中最重的一等——他把家国之重一并托付了"
      - "这是两人最后一次完整告别——《后序》成文时回望，日与貌皆具"
    proofed: true

  # ---------- 八月十八 ----------
  - id: baying-eighteen
    type: narrative
    tone: dark
    title: 八月十八
    text: |
      七月末，他到建康，就病倒了。暑热成疾。你得到消息，乘船一日夜赶了三百里。

      到时已病重。他性子急，胡乱服药，寒热交攻，疟疾转成痢疾。八月十八日，他取笔作诗，绝笔而终——没有分香卖履式的琐碎交代，什么遗嘱都没有留下。年四十九。

      葬毕，余无所之。你大病一场，只剩喘息。

      你四十五岁。书二万卷、金石刻二千卷，从此没有主人。
    image: images/baying-eighteen.jpg
    place: 江宁
    year: 1129
    source: 李清照《金石录后序》「（七月末）感疾……八月十八日，遂不起，取笔作诗，绝笔而终，殊无分香卖履之意……葬毕，余无所之。余又大病，仅存喘息」
    notes:
      - "「分香卖履」：曹操临终分香与诸姬、嘱家人卖履自给——谓琐碎家事遗嘱；《后序》言其无此，谓身后萧然"
      - "赵明诚年四十九（1081-1129）；本页深色底为全篇最黑——丧夫与寄托的双重失去"
    proofed: true

  # ---------- 无所之 ----------
  - id: wusuo-zhi
    type: narrative
    tone: light
    title: 无所之
    text: |
      大病未愈，局势急转直下：金兵大举南下，朝廷从建康一路向杭州、越州方向逃。你无处可归，让两个老吏押运剩下的书二万卷、金石刻二千卷，运往洪州——他的妹婿在那里，可以投靠。

      冬十二月，金人陷洪州。那二万卷，云散了。

      你自己跟着逃难的人流往东南走，去追朝廷的行踪。从此，你的行李，和你的国家，都在流亡。

      「葬毕，余无所之」——你后来只用六个字，写完了那个冬天。
    place: 越州
    year: 1129
    source: 李清照《金石录后序》「事势日迫，念侯有妹婿，任兵部侍郎，从卫在洪州，遂遣二故吏，先部送行李往投之。冬十二月，金人陷洪州，遂尽委弃。所谓连舻渡江之书，又散为云烟矣」
    notes:
      - "洪州书物运出与其散失，均《后序》自述；妹婿任兵部侍郎，随卫太后一行在洪州"
      - "本场景收束于随流民东下——「无所之」三字为《后序》原文"
    proofed: true
