# 第五章：草堂（759-765）
# 休憩与再痛：梦李白、同谷、筑堂、春雨、寻花、茅屋（dark）、闻捷、幕府、离蜀
id: caotang
figure: du-fu
title: 草堂
subtitle: 休憩与再痛
era: 759-765
scenes:
  # ---------- 梦李白 ----------
  - id: dream-libai
    type: poem
    tone: light
    poem_title: 梦李白二首（其一）
    lead_in: 秦州的秋夜，你接连梦见李白——一别十五年，音书断绝，只听说他被判长流夜郎，生死不明。凉州的风声里，你写：「文章憎命达，魑魅喜人过」。而梦里那个人，分明还在——
    text: |
      死别已吞声，生别常恻恻。

      江南瘴疠地，逐客无消息。

      故人入我梦，明我长相忆。

      恐非平生魂，路远不可测。

      魂来枫林青，魂返关塞黑。

      君今在罗网，何以有羽翼。

      落月满屋梁，犹疑照颜色。

      水深波浪阔，无使蛟龙得。

      ——其二（节）

      三夜频梦君，情亲见君意。

      ……

      千秋万岁名，寂寞身后事。
    excerpt: 其一全文；其二节引「三夜频梦君」「千秋万岁名，寂寞身后事」两处，余从略。
    keyline: 千秋万岁名，寂寞身后事
    place: 秦州
    year: 759
    source: 仇兆鳌《杜诗详注》（卷次待核）；《天末怀李白》「文章憎命达，魑魅喜人过」同期
    notes:
      - "李白 759 年三月已遇赦东还；杜甫在秦州未闻赦讯，故有生死之疑。"
      - "「千秋万岁名，寂寞身后事」：为李白占身后名，亦自况。"
      - "李白两年后（762）卒于当涂；杜甫此时尚不知。"
    proofed: true

  # ---------- 同谷七歌 ----------
  - id: tonggu-songs
    type: poem
    tone: light
    poem_title: 乾元中寓居同谷县作歌七首（其一·其七节选）
    lead_in: 秦州寄人篱下，无食无衣，一个月后你带着全家继续南行，到了同谷。你以为这里会有栗可拾、有药可采——同谷的日子比秦州更惨：天寒日暮，你在山谷里捡橡栗充饥。你把这一段的自己写成七首歌——
    text: |
      有客有客字子美，白头乱发垂过耳。

      岁拾橡栗随狙公，天寒日暮山谷里。

      中原无书归不得，手脚冻皴皮肉死。

      呜呼一歌兮歌已哀，悲风为我从天来。

      ——其七（节）

      男儿生不成名身已老，三年饥走荒山道。
    excerpt: 其一全文；其七节引首句，余从略；七歌中「有弟有弟在远方」「有妹有妹在钟离」诸章从略。
    keyline: 岁拾橡栗随狙公，天寒日暮山谷里
    place: 同谷
    year: 759
    source: 仇兆鳌《杜诗详注》（卷次待核）；乾元二年十一月寓同谷——一岁四行役第三段
    notes:
      - "七歌各章分咏己身、弟妹、国家；其一写己身，其七为总结。"
      - "同谷仅居约一月，岁暮即赴成都。"
    proofed: true

  # ---------- 筑草堂 ----------
  - id: caotang-built
    type: narrative
    tone: light
    title: 草堂
    text: |
      岁暮，你翻过木皮岭；正月，进了成都。上元元年春，在城西七里的浣花溪畔，你找到了一块地方——溪水回环，林塘清幽。

      你开始筑屋。表弟出资，朋友们凑钱：一棵桃树的钱，一棵绵竹的钱，一个瓷碗的钱……你一一写诗记账。没有采买豪侈，只有一所茅屋的千辛万苦。

      茅屋落成了。背郭堂成，凭江槛立，白鹭、黄鹂、细雨、微风，都成了窗外的邻居。漂泊五年后，你终于又有了一个家。

      你在这里住了不到四年，断断续续。这座草屋后来塌了、修了、被风揭了顶、被军队占过——但一千二百年后，它还在，改名叫了杜甫草堂。成都人把一条江、一片城区、无数商家招牌，都给了这个名字。
    image: images/caotang-built.jpg
    place: 成都
    year: 760
    source: 《卜居》《堂成》《狂夫》；营建细节（萧实送桃苗等）从王十五司马等诸诗与评传
    notes:
      - "筑堂资助：表弟王十五司马及高适、严武等故旧，诸诗可证。"
      - "「漂泊五年后」：自天宝十四载（755）安史乱起算"
      - "「背郭堂成，凭江槛立」出《堂成》；草堂后世（宋以来）改为祠宇，即今杜甫草堂。"
      - "行程：759 岁暮过木皮岭，经白沙渡、飞仙阁、剑门，760 正月抵成都"
    proofed: true

  # ---------- 春夜喜雨 ----------
  - id: spring-rain
    type: poem
    tone: light
    poem_title: 春夜喜雨
    lead_in: 上元二年早春，成都落了一场夜雨。你在草堂里听——雨无声地下，不惊扰任何人。乱世里过了一辈子的人，被一场好雨安慰了——
    text: |
      好雨知时节，当春乃发生。

      随风潜入夜，润物细无声。

      野径云俱黑，江船火独明。

      晓看红湿处，花重锦官城。
    keyline: 随风潜入夜，润物细无声
    place: 成都
    year: 761
    source: 仇兆鳌《杜诗详注》（卷次待核）；上元二年春
    notes:
      - "「潜入夜」「细无声」：拟人而无一字点破——通篇「喜」字不出现而喜意自见。"
      - "锦官城：成都别称"
    proofed: true

  # ---------- 江畔独步寻花 ----------
  - id: riverside-flowers
    type: poem
    tone: light
    poem_title: 江畔独步寻花七绝句（其六）
    lead_in: 暮春，你一个人沿着浣花溪散步——寻花。走到黄四娘家的小路，花把路都淹了。你写黄四娘的花，写得像孩子——
    text: |
      黄四娘家花满蹊，千朵万朵压枝低。

      留连戏蝶时时舞，自在娇莺恰恰啼。
    keyline: 千朵万朵压枝低
    place: 成都
    year: 761
    source: 仇兆鳌《杜诗详注》（卷次待核）；上元二年暮春
    notes:
      - "黄四娘：草堂邻家——姓氏无考，即景即人"
      - "「恰恰」：莺啼声密，取拟声说。"
    proofed: true

  # ---------- 茅屋为秋风所破 ----------
  - id: maowu-song
    type: poem
    tone: dark
    poem_title: 茅屋为秋风所破歌
    lead_in: 八月，秋风来了。它怒号着卷走了你屋上的三重茅草，茅草飞过江去，挂上树梢，沉进塘坳。南村的孩童抱着茅草跑进竹林，你喊得唇焦口燥，追不上，只能拄着杖自己叹气。夜里下起雨，屋漏、衾寒、彻夜湿冷——就在这样的长夜里，你想的不是自己的屋子——
    text: |
      八月秋高风怒号，卷我屋上三重茅。

      茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。

      南村群童欺我老无力，忍能对面为盗贼。

      公然抱茅入竹去，唇焦口燥呼不得，归来倚杖自叹息。

      俄顷风定云墨色，秋天漠漠向昏黑。

      布衾多年冷似铁，娇儿恶卧踏里裂。

      床头屋漏无干处，雨脚如麻未断绝。

      自经丧乱少睡眠，长夜沾湿何由彻！

      安得广厦千万间，大庇天下寒士俱欢颜，风雨不动安如山！

      呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！
    keyline: 安得广厦千万间，大庇天下寒士俱欢颜
    place: 成都
    year: 761
    source: 仇兆鳌《杜诗详注》（卷次待核）；上元二年八月——诗自述时令
    notes:
      - "由一屋之破推及天下寒士——杜甫人格的标志时刻。"
      - "深色页依据：屋破夜湿的寒夜与「吾庐独破受冻死亦足」的痛愿。"
    proofed: true

  # ---------- 闻官军收河南河北 ----------
  - id: news-of-recovery
    type: poem
    tone: light
    poem_title: 闻官军收河南河北
    lead_in: 宝应元年，你送严武入朝，归途被阻——成都少尹徐知道举兵作乱，你进不了城，只好带着家眷避往梓州，一住一年半。就在这漂泊的第二年春天，官军收复河南河北、安史之乱平定的消息传到剑外。你平生第一次写出这样的诗——后人叫它生平第一快诗——
    text: |
      剑外忽传收蓟北，初闻涕泪满衣裳。

      却看妻子愁何在，漫卷诗书喜欲狂。

      白日放歌须纵酒，青春作伴好还乡。

      即从巴峡穿巫峡，便下襄阳向洛阳。
    keyline: 剑外忽传收蓟北，初闻涕泪满衣裳
    place: 梓州
    year: 763
    source: 仇兆鳌《杜诗详注》（卷次待核）；广德元年春史实；徐知道之乱（762 七月）背景从《资治通鉴》
    notes:
      - "「生平第一快诗」——浦起龙《读杜心解》评语"
      - "末联四地名连珠：还乡路线的诗化。"
      - "「青春作伴」：春光作伴；时在春，正相合"
    proofed: true

  # ---------- 严武幕府 ----------
  - id: yanwu-mufu
    type: event
    tone: light
    title: 杜工部
    text: |
      广德二年春，严武再镇蜀地。乱平了，你带着家回到草堂——离开两年的茅屋还在，只是更破了。

      严武表荐你为检校工部员外郎，请你入幕任节度参谋。后世叫你杜工部，就是从这个加衔来的。幕府的日子清苦而拘束：天不亮入府，日暮才归，节度使的仪仗里容不下诗人的散漫。你那阵子写给严武的诗，满是束缚酬知己的苦笑。

      几个月后，你辞职回了草堂。做官的日子，你一生加起来前后不过三四年——这一次是最后一次。

      回草堂的那个春天，你写了一组绝句，其中一首二十八个字，后来成了汉语里最有名的儿童诗：两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。
    image: images/yanwu-mufu.jpg
    place: 成都
    year: 764
    source: 仇兆鳌《杜诗详注》（卷次待核）；《奉和严郑公军城早秋》；《绝句四首》其三（两个黄鹂）广德二年春重返草堂作
    notes:
      - "幕职为节度参谋，检校工部员外郎为严武表荐的加衔——职衔措辞从职官考订"
      - "「前后不过三四年」：胄曹参军（755.10 起）＋左拾遗（757.5-758.6）＋华州司功（758.6-759.7）＋严武幕参谋（764），名义合计约三年余"
      - "「束缚酬知己」意出《遣闷奉呈严公二十韵》，见幕府苦况。"
      - "《绝句四首》其三作于广德二年（764）春重返草堂时。"
    proofed: true

  # ---------- 离蜀 ----------
  - id: leaving-shu
    type: narrative
    tone: light
    title: 去蜀
    text: |
      永泰元年四月，严武死了。年仅四十岁。

      你在成都最后的一点依靠，没有了。新任节度使是郭英乂，武人骄横，不是可以相依的人；蜀中的局势眼看又要乱。五月，你带着全家登舟，离开成都，顺岷江而下。

      五载客蜀郡，一年居梓州——你后来总结这六年，只用了十四个字。成都给了你一生里最长的一段安稳，也看着它一寸一寸收了回去。

      舟发锦江，回头望，草堂的茅檐隐在修竹后面，越来越小。你没有再回过成都。
    image: images/leaving-shu.jpg
    place: 成都
    year: 765
    source: 《去蜀》「五载客蜀郡，一年居梓州。如何关塞阻，转作潇湘游」；严武卒永泰元年四月从《旧唐书》
    notes:
      - "严武卒年四十——本传；五月离蜀东下——系年从年谱"
      - "「转作潇湘游」预示后半生行程。"
    proofed: true
