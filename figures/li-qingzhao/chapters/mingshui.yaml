# 明水章：藕花深处
# 情绪曲线：书香 - 少女纵兴 - 词名进京
# 叙事以第二人称沉浸展开；重演绎处已在 notes 标注；已交叉校对（proofed: true）
id: mingshui
figure: li-qingzhao
title: 明水
subtitle: 藕花深处
era: 1084-1100
scenes:
  # ---------- 生于明水 ----------
  - id: birth-mingshui
    type: narrative
    tone: light
    title: 生于明水
    text: |
      元丰七年，你生在齐州章丘的明水镇。

      父亲李格非，进士出身，写一手好文章，后来名列「苏门后四学士」——进出你这个家门的人，是天下最会写文章的一群。

      母亲王氏，也读书，也作文。在这个家里，女孩和书之间没有门槛。你识字早，读得快，读到会心处，一个人笑出声来，没有人觉得奇怪。

      明水多泉，水汽终年不散。镇外有湖，湖里夏天开满藕花。你的少女时代，一半在书堆里，一半在水边——那时你不知道，这两样东西，将是你一生全部的行李。
    image: images/birth-mingshui.jpg
    place: 明水
    year: 1084
    source: 徐培均《李清照集笺注》附年谱元丰七年条；王仲闻《李清照集校注》（卷次待核）
    notes:
      - "生年元丰七年（1084）从年谱通说；籍贯有章丘明水、历城两说，此从章丘说"
      - "母王氏善文，见《宋史·李格非传》；外祖家世另有异说，不取"
    proofed: true

  # ---------- 溪亭日暮 ----------
  - id: xiting-dusk
    type: poem
    tone: light
    poem_title: 如梦令·常记溪亭日暮
    lead_in: 那是一个再普通不过的夏日傍晚。溪亭，日头西沉，一船人喝醉了酒，谁也记不清回去的水路。船误入藕花深处，桨声、笑声，惊起满滩鸥鹭。那年你十几岁，酒是甜的，天是红的，找不到回家的路，也不要紧——
    text: |
      常记溪亭日暮，沉醉不知归路。

      兴尽晚回舟，误入藕花深处。

      争渡，争渡，惊起一滩鸥鹭。
    keyline: 兴尽晚回舟，误入藕花深处
    place: 明水
    year: 1098
    source: 王仲闻《李清照集校注》（卷次待核）；词系早年追忆故乡旧游
    notes:
      - "「常记」一作「尝记」；「争渡」一作「怎渡」——异文并录"
      - "词为追忆口吻，所忆为少女时期旧游；溪亭地望有明水、历下诸说，均在济南境内"
    proofed: true

  # ---------- 雨疏风骤 ----------
  - id: yushu-fengzhou
    type: poem
    tone: light
    poem_title: 如梦令·昨夜雨疏风骤
    lead_in: 后来你随父亲进了汴京，词名跟着你进了城。某个宿醉的清晨，你问卷帘的侍女：海棠怎么样了。她说：海棠依旧。你说不，你写下这三十三个字——城里传抄开来，「绿肥红瘦」人人称赏。也是在那几年，前辈张耒咏浯溪中兴碑，你一个少女提笔和了两首，直论安史之乱的教训，「夏商有鉴当深戒，简策汗青今具在」。词笔轻，诗笔重，两样都在你手里——
    text: |
      昨夜雨疏风骤，浓睡不消残酒。

      试问卷帘人，却道海棠依旧。

      知否，知否？应是绿肥红瘦。
    keyline: 知否，知否？应是绿肥红瘦
    place: 汴京
    year: 1100
    source: 王仲闻《李清照集校注》（卷次待核）；《浯溪中兴颂诗和张文潜》二首同卷
    notes:
      - "「绿肥红瘦」：绿叶繁、红花稀——以肥瘦说叶花，前人未用的语汇"
      - "宋人朱弁《风月堂诗话》记晁补之多对士大夫称许易安之诗；后人「莫不击节称赏」云云为夸饰，不取"
      - "《浯溪中兴颂诗和张文潜》二首系年有婚前、婚后二说，今从早年说"
    proofed: true
