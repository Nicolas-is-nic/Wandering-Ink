# 第六章：夔州（766-768）
# 苍茫：迁夔、秋兴、登高（dark）、观剑器、又呈吴郎
id: kuizhou
figure: du-fu
title: 夔州
subtitle: 苍茫
era: 766-768
scenes:
  # ---------- 迁居夔州 ----------
  - id: kuizhou-years
    type: narrative
    tone: light
    title: 孤城
    text: |
      离蜀的船走得慢。嘉州、戎州、渝州、忠州，一路走走停停——你在云安一病就是一个冬天，肺病、消渴，缠绵到永泰二年春才勉强能动。

      大历元年春，你把家搬进了夔州——长江三峡边的孤城，白帝城下。夔州都督柏茂琳敬重你，拨了西阁让你住，又让你代管东屯的一处公田。漂泊两年，你终于又有了立脚的地方。

      此时的你五十五岁，身体的账单越拉越长：左耳聋了，牙齿掉了一半，肺病疟疾轮番来。可是就在这座孤城里，你迎来了创作最后的、也是最深的井喷——近两年，四百多首诗。律诗在你手里，到了随心所欲而不逾矩的地步。

      人间给他的越来越少，他还给人间的越来越多。
    image: images/kuizhou-years.jpg
    place: 夔州
    year: 766
    source: 《移居夔州作》；柏茂琳照拂与东屯公田从仇兆鳌《杜诗详注》纪年与年谱；病况自诸诗
    notes:
      - "久病滞云安至 765 岁末，766 春迁夔州。"
      - "夔州近两年（766 春-768 正月）作诗四百余首——通行统计（含云安计约 472 之说），近两年为约数"
      - "「人间给他的越来越少」两句为收束语，演绎"
    proofed: true

  # ---------- 秋兴八首 ----------
  - id: qiuxing
    type: poem
    tone: light
    poem_title: 秋兴八首（其一）
    lead_in: 大历二年秋，白帝城的暮砧一声一声传来。玉露凋伤了枫树林，巫山巫峡，气象萧森。你面对秋江，想起长安——一组八首的连章律诗，从夔州的秋色一路写到长安的宫阙。第一首起调——
    text: |
      玉露凋伤枫树林，巫山巫峡气萧森。

      江间波浪兼天涌，塞上风云接地阴。

      丛菊两开他日泪，孤舟一系故园心。

      寒衣处处催刀尺，白帝城高急暮砧。
    keyline: 丛菊两开他日泪，孤舟一系故园心
    place: 夔州
    year: 767
    source: 仇兆鳌《杜诗详注》（卷次待核）；大历二年秋
    notes:
      - "八首连章，此处选其一；余章写夔府孤城、匡衡抗疏、闻道长安等。"
      - "「丛菊两开」：两见秋菊（云安一秋、夔州一秋）——系年内证"
      - "「孤舟一系故园心」：孤舟系岸、心系故园——八首总纲句"
    proofed: true

  # ---------- 登高 ----------
  - id: denggao
    type: poem
    tone: dark
    poem_title: 登高
    lead_in: 重阳，你登上了夔州的高台。风急天高，猿声凄厉；落木无边，长江不尽。五十六岁的人，把一生的漂泊与病痛都带到了台上——七律的极致，后人推为古今第一——
    text: |
      风急天高猿啸哀，渚清沙白鸟飞回。

      无边落木萧萧下，不尽长江滚滚来。

      万里悲秋常作客，百年多病独登台。

      艰难苦恨繁霜鬓，潦倒新停浊酒杯。
    keyline: 无边落木萧萧下，不尽长江滚滚来
    place: 夔州
    year: 767
    source: 仇兆鳌《杜诗详注》（卷次待核）；大历二年秋重阳前后；登临处诸说不一，正文作「夔州高台」
    notes:
      - "「万里悲秋常作客」：罗大经拆作八层悲意（万里、悲秋、作客、常作客、百年、多病、登台、独登台）。"
      - "「潦倒新停浊酒杯」：因病断酒——与肺疾互证"
      - "深色页依据：万里悲秋，全篇孤独的顶点"
    proofed: true

  # ---------- 观剑器舞 ----------
  - id: sword-dance
    type: event
    tone: light
    title: 五十年
    text: |
      大历二年十月，夔州别驾元持宅里，一场宴会。有位李十二娘起舞舞剑器，浑脱流转，惊人动魄。

      你看着看着，忽然想起：五十年前，开元五年，你还是个孩子，在郾城看过她的师父公孙大娘舞剑器浑脱——那时的公孙大娘是天下第一，观者如山，天地为之久低昂。五十年，从开元的极盛到眼前的流离，中间隔着一整场安史之乱。

      你问她师父的下落。公孙大娘的消息，已无人说得清，弟子也流落至此。

      你为此写了一首诗，前面附了很长的序——五十年间似反掌，风尘澒洞昏王室。一段盛衰，就压在这两行诗里。
    place: 夔州
    year: 767
    source: 《观公孙大娘弟子舞剑器行》诗序自述（大历二年十月十九日夔州见李十二娘舞剑器）；郾城观公孙大娘在开元年间
    notes:
      - "诗序记观公孙大娘在开元五载（一作三载），去此恰五十年。"
      - "「五十年间似反掌，风尘澒洞昏王室」为行中句，已化入叙事。"
      - "诗序只言弟子「亦匪盛颜」，未及公孙大娘生死"
    proofed: true

  # ---------- 又呈吴郎 ----------
  - id: wulang-poem
    type: poem
    tone: light
    poem_title: 又呈吴郎
    lead_in: 你从夔州的西阁搬到瀼西，把原来的屋子借给了一位吴姓亲戚。新来的人一插篱笆，西邻的老妇人就不敢再来打枣了——她无食无儿，靠打枣度日。你替她写诗，呈给吴郎——一首替寡妇说话的七律，在杜诗里显得那样家常——
    text: |
      堂前扑枣任西邻，无食无儿一妇人。

      不为困穷宁有此？只缘恐惧转须亲。

      即防远客虽多事，便插疏篱却甚真。

      已诉征求贫到骨，正思戎马泪盈巾。
    keyline: 已诉征求贫到骨，正思戎马泪盈巾
    place: 夔州
    year: 767
    source: 仇兆鳌《杜诗详注》（卷次待核）；大历二年秋
    notes:
      - "由一件小事（扑枣）直抵时代（征求、戎马）——杜甫仁心的最后注脚。"
      - "吴郎：吴姓亲戚，自忠州来——事见诗题与本注"
    proofed: true
