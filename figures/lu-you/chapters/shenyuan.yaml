# 沈园章：钗头凤
# 情绪曲线：成婚之暖 - 仳离之痛 - 科场三幕 - 沈园重逢题壁（全篇第一回响）
# 科场与沈园双线在章内交汇于 1155；唐氏只称「她」，不写名
id: shenyuan
figure: lu-you
title: 沈园
subtitle: 钗头凤
era: 1144-1155
scenes:
  # ---------- 成婚 ----------
  - id: chenghun
    type: narrative
    tone: light
    title: 二十岁成婚
    text: |
      绍兴十四年前后，你二十岁，成了婚。

      她也读书，也能诗文。花前月下的小令，你们互相唱和；金石书画的赏鉴，你们一起勘校。你写「红酥手」里那样的酒盏，她斟；你读书读到会心处，她就在灯的另一侧。

      亲事是长辈定的，两个年轻人却真的投契。旁人看来，这是山阴陆家一段再圆满不过的姻缘。

      没有人想到，它只维持了短短几年。
    image: images/chenghun.jpg
    place: 山阴
    year: 1144
    source: 周密《齐东野语》卷一；陈鹄《耆旧续闻》；于北山《陆游年谱》绍兴十四年前后条
    notes:
      - "成婚年份为推定；唐氏家世、闺中唱和情形，均出宋人笔记，具体细节不可确考，演绎"
    proofed: true

  # ---------- 仳离 ----------
  - id: pilv
    type: narrative
    tone: dark
    title: 仳离
    text: |
      变故从家里来。不知从何时起，母亲对她有了芥蒂——缘由，没有任何记载留下来。只有结果：这段婚姻，家里不容。

      你抗争过。据说曾另筑别院安置她，被母亲发现，终至不能保全。一纸离书，两个年轻人各自天涯。

      不久，你另娶王氏；她改嫁宗室赵氏。路就此断尽了。

      你们的婚姻短，此后各自的岁月却都很长。这页写到仳离为止——她的后半生，要等几十年后的诗来告诉你。
    image: images/pilv.jpg
    place: 山阴
    year: 1147
    source: 周密《齐东野语》卷一「不当母夫人意」「弗获于其姑」；陈鹄《耆旧续闻》
    notes:
      - "母不悦缘由史无明文，无子说、姑媳失和说皆出后世推测，不作叙述"
      - "别院安置事出《齐东野语》，属笔记记载，细节存疑，此处仅一句带过"
      - "本页深色底：婚变离散之痛"
    proofed: true

  # ---------- 科场三幕 ----------
  - id: kechang-sanmu
    type: narrative
    tone: light
    title: 科场三幕
    text: |
      绍兴二十三年，你到临安应试。两浙转运司的锁厅试上，主考官读了你的卷子，把你取为第一——排在第二的，是宰相秦桧的孙子秦埙。秦桧大怒。

      次年礼部试，报复到了：你的卷子被直接黜落。同科里都知道那篇文章本该在哪儿，没有人敢说话。功名之路，被一只手按死。

      你回山阴，等待。这一等又是两年。

      绍兴二十五年十月，秦桧死了。朝局的坚冰裂开一道缝——你不知道的是，你这辈子与科场、与朝局的纠缠，才刚刚开始。
    image: images/kechang-sanmu.jpg
    place: 临安
    year: 1153
    source: 《宋史·陆游传》「锁厅荐送第一，秦桧孙埙适居其次，桧怒，至罪主者」；于北山《陆游年谱》绍兴二十三、二十四年条
    notes:
      - "擢陆游第一的主考为陈之茂，因取陆游置秦埙前而遭秦桧记恨"
      - "礼部试黜落，通行从秦桧挟怨说，《宋史》本传系于锁厅试怒后"
    proofed: true

  # ---------- 沈园 ----------
  - id: shenyuan-chaitoufeng
    type: poem
    tone: light
    poem_title: 钗头凤·红酥手
    lead_in: 绍兴二十五年春，禹迹寺南的沈氏园，花开正好。你进园游春，在园中遇见了她——和她的后夫。数年不见，各自有家有路。她遣人送来酒肴。你在这份沉默的旧情前坐了很久，酒入了喉，往事漫上来——园壁就在手边，你提笔——
    text: |
      红酥手，黄縢酒，满城春色宫墙柳。

      东风恶，欢情薄。一怀愁绪，几年离索。错、错、错。

      春如旧，人空瘦，泪痕红浥鲛绡透。

      桃花落，闲池阁。山盟虽在，锦书难托。莫、莫、莫。
    keyline: 山盟虽在，锦书难托
    place: 山阴
    year: 1155
    source: 周密《齐东野语》卷一叙沈园本事；陈鹄《耆旧续闻》记亲见此词题于园壁；词从夏承焘、吴熊和《放翁词编年笺注》
    notes:
      - "沈园相遇、遣致酒肴、题壁，本事出《齐东野语》；题壁时地与《耆旧续闻》所记相合"
      - "「黄縢酒」一作「黄藤酒」——异文并录"
      - "题壁次年前后，她怏怏而卒——此事后文沈园诸诗再及"
      - "词写定系年从通行编年；本事出宋人笔记，词境与本事相合"
    proofed: true
