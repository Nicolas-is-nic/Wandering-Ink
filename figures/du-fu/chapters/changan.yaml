# 第二章：长安（746-755）
# 儒冠多误身：十年困顿——制举、干谒、献赋、兵车、丽人、幼子之殇（dark）
id: changan
figure: du-fu
title: 长安
subtitle: 儒冠多误身
era: 746-755
scenes:
  # ---------- 入长安 ----------
  - id: enter-changan
    type: narrative
    tone: light
    title: 入长安
    text: |
      天宝五载，三十五岁的你走进长安。

      此前的履历足够自信：七岁作诗，十四五岁出入翰墨场，望岳诗才名初动。你以为长安会用它对待才士的方式对待你——干谒、举荐、一纸任命。

      现实很快教你重新认识这座城。旅费花完，你开始寄食友朋；门路走窄，你开始朝扣富儿门，暮随肥马尘。残杯与冷炙，到处潜悲辛——这十个字，是你在长安最初的口粮。

      十年。你在这座当时世界上最大的城市里，做了整整十年的候补者。
    image: images/enter-changan.jpg
    place: 长安
    year: 746
    source: 仇兆鳌《杜诗详注》天宝五载纪；《奉赠韦左丞丈二十二韵》「朝扣富儿门」段
    notes:
      - "「朝扣富儿门，暮随肥马尘。残杯与冷炙，到处潜悲辛」——《奉赠韦左丞丈》原文"
      - "「寄食友朋」出《进三大礼赋表》自述——指天宝十载前后的窘况，本场景作长安十年总括性引述，notes 说明"
      - "本场景以《奉赠韦左丞丈》句写 746 年入长安境况——诗句系 747-750 年间追写，文学化概括——校对 C6 备"
    proofed: true

  # ---------- 野无遗贤 ----------
  - id: no-talent-left
    type: event
    tone: light
    title: 野无遗贤
    text: |
      入长安第二年，朝廷开制举，诏征天下有一艺者赴京应试。你去了——这是制度留给读书人最堂堂正正的一扇门。

      考试结束，宰相李林甫向皇帝上表祝贺：野无遗贤——天下人才都已在朝中，民间再没有遗漏的贤者。于是这一科，无一人及第。包括你，也包括所有和你一起赴考的人。

      一场考试，零个进士。荒诞的不是落第，是落第被包装成了盛世的证明。李林甫的四个字冷冷压住一切：在野无遗贤的年代，一个在野者连失望都显得不合时宜。你后来把这一年写进《奉赠韦左丞丈》：青冥却垂翅，蹭蹬无纵鳞。

      科举的门，就这样在你面前关上了。此后你只剩一条路：以诗干谒，以赋求进。
    place: 长安
    year: 747
    source: 《资治通鉴》天宝六载制举「野无遗贤」条；陈贻焮《杜甫评传》
    notes:
      - "天宝六载（747）制举无一人及第——信史级"
      - "「野无遗贤」四字出自李林甫贺表，非杜甫诗——杜甫记此年心境见《奉赠韦左丞丈》「青冥却垂翅，蹭蹬无纵鳞」——校对 C1 已分立"
      - "杜甫与李林甫关系的总体态度见后日诗《奉赠韦左丞丈》「甚愧丈人厚」段——本场景不展开"
    proofed: true

  # ---------- 奉赠韦左丞 ----------
  - id: weijian-poem
    type: poem
    tone: light
    poem_title: 奉赠韦左丞丈二十二韵（节选）
    lead_in: 举场失意后，你把十年不遇的块垒，写进一首呈给尚书左丞韦济的长诗。后世评它为「自荐诗的绝唱」——自荐而全无媚态，句句是傲骨与辛酸——
    text: |
      纨绔不饿死，儒冠多误身。

      丈人试静听，贱子请具陈。

      甫昔少年日，早充观国宾。

      读书破万卷，下笔如有神。

      ……

      自谓颇挺出，立登要路津。

      致君尧舜上，再使风俗淳。

      ……

      朝扣富儿门，暮随肥马尘。

      残杯与冷炙，到处潜悲辛。
    excerpt: 节录开篇、自陈与干谒三段，中段自述「赋料扬雄敌，诗看子建亲」及骑驴旅食诸韵从略，全文俟按仇注校录。
    keyline: 读书破万卷，下笔如有神
    place: 长安
    year: 750
    source: 仇兆鳌《杜诗详注》（卷次待核）；场景年 750 从韦济墓志新说（韦济九载迁尚书左丞，「左丞」官称自洽）；仇注旧系天宝七载前后入 notes
    notes:
      - "系年：墓志新说 750-752（胡可先考），本场景取 750 代表值；仇注编次旧系天宝七载（748）——两说并录，校对时按底本定"
      - "「致君尧舜上，再使风俗淳」——杜甫政治理想的第一次完整表述"
    proofed: true

  # ---------- 三大礼赋 ----------
  - id: sanli-rhapsody
    type: event
    tone: light
    title: 三大礼赋
    text: |
      献诗不成，你换了文体。天宝十载，朝廷将行三大礼，你献上《朝献太清宫赋》《朝享太庙赋》《有事于南郊赋》三篇。

      这一次，惊动了皇帝本人。玄宗读赋奇之，命你待制集贤院，召试文章。集贤院的学士们围看你执笔——你晚年想起那天还带着得意：集贤学士如堵墙，观我落笔中书堂。

      然后呢？命宰相试文章，试完，如石沉大海。掌权的还是李林甫，他不需要一个在野的才子来证明野无遗贤是谎言。

      往时文采动人主，此日饥寒趋路旁。皇帝的赏识救不了你，你依旧在长安的市场里买药，向朋友家寄食。文学史上最著名的一次面试，就此不了了之。
    image: images/sanli-rhapsody.jpg
    place: 长安
    year: 751
    source: 《进三大礼赋表》；《莫相疑行》「往时文采动人主」「集贤学士如堵墙」；陈贻焮《杜甫评传》
    notes:
      - "天宝十载（751）献三大礼赋、待制集贤院——信史级"
      - "「卖药都市，寄食友朋」出《进三大礼赋表》自述——长安期窘况，与潭州无涉"
      - "「此日饥寒趋路旁」为《莫相疑行》追忆句"
    proofed: true

  # ---------- 兵车行 ----------
  - id: bingche-xing
    type: poem
    tone: light
    poem_title: 兵车行
    lead_in: 也是这几年，你在咸阳桥头看见了送行的队伍——车辚辚，马萧萧，被征发的丁壮与哭送的家人生离死别。道旁过者的你拦住行人问，行人只回了四个字：点行频。你把这一桥、一问、一答，写成了给穷兵黩武时代记账的歌行——
    text: |
      车辚辚，马萧萧，行人弓箭各在腰。

      耶娘妻子走相送，尘埃不见咸阳桥。

      牵衣顿足拦道哭，哭声直上干云霄。

      ……

      道旁过者问行人，行人但云点行频。

      或从十五北防河，便至四十西营田。

      去时里正与裹头，归来头白还戍边。

      ……

      边庭流血成海水，武皇开边意未已。

      君不闻汉家山东二百州，千村万落生荆杞。

      ……

      信知生男恶，反是生女好。

      生女犹得嫁比邻，生男埋没随百草。

      君不见青海头，古来白骨无人收。

      新鬼烦冤旧鬼哭，天阴雨湿声啾啾。
    excerpt: 节录开篇、问答、议论、结尾四段，中段「纵有健妇把锄犁」与「长者虽有问」诸韵从略，全文俟按仇注校录。
    keyline: 边庭流血成海水，武皇开边意未已
    place: 长安
    year: 751
    source: 仇兆鳌《杜诗详注》（卷次待核）；系年天宝十载为主
    notes:
      - "系年诸说：天宝十载（751）为主，一说九载——notes 并列；本事有征南诏、用兵吐蕃（哥舒翰攻石堡）两说，notes 并存"
      - "「行人但云点行频」以下全借征人之口——歌行体的叙事装置，笺解从通行本"
    proofed: true

  # ---------- 丽人行 ----------
  - id: liren-xing
    type: poem
    tone: light
    poem_title: 丽人行
    lead_in: 又两年，三月三，上巳节。曲江水边，杨氏一门的贵妇出游，香车宝马，鲜衣怒马。你混在游人里，冷眼看完了这场豪奢的春游，回去写了一首诗——通篇白描，无一贬词，讽刺全在画面里——
    text: |
      三月三日天气新，长安水边多丽人。

      态浓意远淑且真，肌理细腻骨肉匀。

      ……

      就中云幕椒房亲，赐名大国虢与秦。

      紫驼之峰出翠釜，水精之盘行素鳞。

      ……

      后来鞍马何逡巡，当轩下马入锦茵。

      杨花雪落覆白蘋，青鸟飞去衔红巾。

      炙手可热势绝伦，慎莫近前丞相嗔。
    excerpt: 节录起笔、宴饮、结拍三段，中段服饰「绣罗衣裳照暮春」诸韵从略，全文俟按仇注校录。
    keyline: 炙手可热势绝伦，慎莫近前丞相嗔
    place: 长安
    year: 753
    source: 仇兆鳌《杜诗详注》（卷次待核）；天宝十二载春；杨国忠十一载十一月拜相
    notes:
      - "「丞相」指杨国忠；虢国、秦国、韩国三夫人即「赐名大国虢与秦」——本事信史级"
      - "三大礼赋全名带「赋」字——校对 C2"
      - "通篇不动声色、末句方见锋芒——笺解从通行本（乐府讽刺手法）"
    proofed: true

  # ---------- 自京赴奉先 ----------
  - id: fengxian-threnody
    type: poem
    tone: dark
    poem_title: 自京赴奉先县咏怀五百字（节选）
    lead_in: 天宝十四载末，你终于得到一个看管兵器甲仗的小官——右卫率府兵曹参军。年底，你从长安动身，去奉先县探望寄居的妻子。一路上，你把自己半生的抱负与失意、驿道两旁的饥民与朱门，全都写进一首五百字的长诗。走到家门口，你听见里面一片号啕——你的小儿子，饿死了。安禄山已在范阳起兵，消息还没有传到长安——
    text: |
      杜陵有布衣，老大意转拙。

      许身一何愚，窃比稷与契。

      ……

      穷年忧黎元，叹息肠内热。

      ……

      朱门酒肉臭，路有冻死骨。

      荣枯咫尺异，惆怅难再述。

      ……

      入门闻号啕，幼子饥已卒。

      吾宁舍一哀，里巷亦呜咽。
    excerpt: 节录咏怀、纪行、入门三段；中段凌晨过骊山「赐浴皆长缨」诸韵从略，全文俟按仇注校录。
    keyline: 朱门酒肉臭，路有冻死骨
    place: 奉先
    year: 755
    source: 仇兆鳌《杜诗详注》（系年条，卷次待核）；幼子饿死为诗自述；安禄山起兵（十一月）背景从《资治通鉴》
    notes:
      - "幼子饥已卒——诗自述，信史级；全篇写于安史之乱爆发而长安未知的时刻——诗史分水岭"
      - "「朱门」一联在篇中位置居前段之末，不因节选重排——按仇注原文顺序"
      - "dark 依据：丧子至痛+乱前夕+个人与时代双重谷底"
      - "「入门闻号啕」仇本或作「号咷」——异文待底本核，通行选本作「号啕」——校对 C7"
    proofed: true
