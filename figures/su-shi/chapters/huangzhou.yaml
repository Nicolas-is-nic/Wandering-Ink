      三月七日，沙湖道中遇雨。雨具先去，同行皆狼狈，余独不觉。已而遂晴，故作此词。

      莫听穿林打叶声，何妨吟啸且徐行。

      竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。

      料峭春风吹酒醒，微冷，山头斜照却相迎。

      回首向来萧瑟处，归去，也无风雨也无晴。
    keyline: 也无风雨也无晴
    place: 黄州
    year: 1084
    lead_in: 现在，再读一遍。
    source: 邹同庆、王宗堂《苏轼词编年笺注》，元丰五年编年（重读仪式场景）
